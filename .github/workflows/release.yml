name: release
run-name: Release check for ${{ github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release if version is new
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@main

    - name: Determine version
      id: version
      run: |
        VERSION=$(/usr/libexec/PlistBuddy -c 'Print :version' info.plist)
        if [ -z "$VERSION" ]; then
          echo "Could not read version from info.plist" >&2
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check for existing release
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists; nothing to do."
          echo "needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "Release $TAG does not exist; will create it."
          echo "needed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build alfredworkflow archive
      if: steps.check.outputs.needed == 'true'
      run: make alfredworkflow

    - name: Extract release notes from CHANGELOG.md
      if: steps.check.outputs.needed == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        awk -v version="$VERSION" '
          $0 == "## " version { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "No CHANGELOG.md entry found for $VERSION" >&2
          exit 1
        fi
        cat release_notes.md

    - name: Create release
      if: steps.check.outputs.needed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        gh release create "$TAG" \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes-file release_notes.md \
          joplin.alfredworkflow
